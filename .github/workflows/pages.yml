name: pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
      - site/**
      - tests/test-repository.py

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package landing page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate repository and landing page
        run: python3 tests/test-repository.py

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy landing page
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify participating search engines with IndexNow
        env:
          INDEXNOW_KEY: f2816059f4e9897a617c4f65de3dee83
          SITE_URL: https://sfungwinbond.github.io/Gstackwut
        run: |
          set -euo pipefail
          key_url="$SITE_URL/$INDEXNOW_KEY.txt"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$key_url" >/dev/null
          curl --fail --silent --show-error --get https://api.indexnow.org/indexnow \
            --data-urlencode "url=$SITE_URL/" \
            --data-urlencode "key=$INDEXNOW_KEY" \
            --data-urlencode "keyLocation=$key_url"
